name: skin_disease_app
description: "Do An Tot Nghiep - Du Doan Benh Ve Da"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  image: ^4.8.0
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.0
  google_fonts: ^6.3.0
  intl: ^0.19.0
  fl_chart: ^1.1.0
  http: ^1.6.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  get_storage: ^2.1.1
  google_generative_ai: ^0.4.7
  camera: ^0.11.2
  flutter_markdown: ^0.7.7+1
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.0
  firebase_auth: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

dependency_overrides:
  vector_math: ^2.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/data/
    - assets/documents/
    - .env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  # Cấu hình Adaptive Icon cho Android 8+ để mất viền xám
  adaptive_icon_background: "#0077B6" # Đổi mã màu nền bạn muốn ở đây
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  color: "#0077B6" # Mã màu nền Splash
  image: "assets/images/logo.png"

  android_12:
    color: "#0077B6"
    image: "assets/images/logo.png"